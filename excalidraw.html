<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excalidraw Canvas</title>
  <style>
    html, body, #root {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #121212;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #18181b;
      color: #e4e4e7;
      font-size: 14px;
      gap: 16px;
      z-index: 100;
      transition: opacity 0.25s ease;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: cb-spin 0.75s linear infinite;
    }
    @keyframes cb-spin {
      to { transform: rotate(360deg); }
    }
    .loading-tip {
      color: #a1a1aa;
      font-size: 12px;
    }
    /* 屏蔽官方外部营销链接与多余菜单 */
    .excalidraw .help-dialog-button {
      display: none !important;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "@excalidraw/excalidraw": "https://esm.sh/@excalidraw/excalidraw@0.18.1"
      }
    }
  </script>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div style="font-weight: 500;">正在载入 Excalidraw 手绘矢量白板引擎...</div>
    <div class="loading-tip">支持手绘自由涂鸦、几何形状、压感画笔与开源素材库</div>
  </div>
  <div id="root"></div>

  <script type="module">
    import React, { useState, useEffect } from 'react';
    import { createRoot } from 'react-dom/client';
    import { Excalidraw } from '@excalidraw/excalidraw';

    window.EXCALIDRAW_ASSET_PATH = "https://cdn.jsdelivr.net/npm/@excalidraw/excalidraw@0.18.0/dist/prod/";

    let excalidrawAPI = null;
    let isInitialLoaded = false;
    let pendingScene = null;

    function App() {
      const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const [theme, setTheme] = useState(isDark ? 'dark' : 'light');

      const handleChange = (elements, appState) => {
        if (!isInitialLoaded) return;
        window.parent.postMessage({
          type: 'EXCALIDRAW_CHANGE',
          elements,
          appState: {
            viewBackgroundColor: appState.viewBackgroundColor,
            currentItemFontFamily: appState.currentItemFontFamily,
            theme: appState.theme,
          }
        }, '*');
      };

      return React.createElement(Excalidraw, {
        excalidrawAPI: (api) => {
          excalidrawAPI = api;
          const loadingEl = document.getElementById('loading');
          if (loadingEl) {
            loadingEl.style.opacity = '0';
            setTimeout(() => loadingEl.remove(), 250);
          }
          window.parent.postMessage({ type: 'EXCALIDRAW_READY' }, '*');

          if (pendingScene) {
            excalidrawAPI.updateScene(pendingScene);
            pendingScene = null;
            setTimeout(() => { isInitialLoaded = true; }, 100);
          } else {
            isInitialLoaded = true;
          }
        },
        theme: theme,
        langCode: 'zh-CN',
        onChange: handleChange,
        UIOptions: {
          canvasActions: {
            saveToActiveFile: false,
            loadScene: true,
            export: { saveFileToDisk: true },
            theme: true,
          }
        }
      });
    }

    window.addEventListener('message', (event) => {
      const { type, payload } = event.data || {};
      if (type === 'SET_SCENE') {
        const scene = {
          elements: Array.isArray(payload?.elements) ? payload.elements : [],
          appState: payload?.appState || {}
        };
        if (excalidrawAPI) {
          isInitialLoaded = false;
          excalidrawAPI.updateScene(scene);
          setTimeout(() => { isInitialLoaded = true; }, 100);
        } else {
          pendingScene = scene;
        }
      } else if (type === 'SET_THEME') {
        if (excalidrawAPI && payload?.theme) {
          excalidrawAPI.updateScene({
            appState: { theme: payload.theme }
          });
        }
      }
    });

    const root = createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
